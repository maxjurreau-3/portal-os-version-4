<!-- portal-os-v4/assets/icon-bee-portal.svg -->
<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="portalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </radialGradient>
  </defs>

  <!-- Portal ring -->
  <circle cx="180" cy="180" r="160" fill="none" stroke="#000" stroke-width="18"/>
  <circle cx="180" cy="180" r="140" fill="none" stroke="#FFD34E" stroke-width="12"/>

  <!-- Bee body -->
  <circle cx="180" cy="180" r="80" fill="url(#portalGrad)" stroke="#000" stroke-width="10"/>

  <!-- Stripes -->
  <rect x="130" y="160" width="100" height="22" fill="#000"/>
  <rect x="130" y="200" width="100" height="22" fill="#000"/>

  <!-- Head -->
  <circle cx="180" cy="120" r="35" fill="#000"/>

  <!-- Wings -->
  <ellipse cx="120" cy="150" rx="55" ry="35" fill="#FFF" opacity="0.85"/>
  <ellipse cx="240" cy="150" rx="55" ry="35" fill="#FFF" opacity="0.85"/>
</svg>
